[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalforge"
version = "0.2.0"
description = "Desktop app for recording vocals over music tracks with automatic alignment, normalization, and mixing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Artem Shamsuarov" },
]
keywords = ["audio", "vocals", "recording", "mixing", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PySide6>=6.6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyloudnorm>=0.1.1",
    "noisereduce>=3.0.0",
]

[project.optional-dependencies]
separation = [
    "torch>=2.0.0",
    "demucs>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
vocalforge = "vocalforge.app:main"

[project.urls]
Repository = "https://github.com/Artemarius/VocalForge"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that require the Demucs model (deselect with '-m \"not slow\"')",
]
